[project]
name = "modeling-f1-cars-with-solid-foundations"
version = "1.0.0"
description = "SOLID principles in Python, told through the evolution of an F1 car."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["marimo>=0.24"]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
