# Every code example in the article and notebook, in reading order. Each entry is one gist.
#
# kind = "file"     publish an app/ module verbatim
# kind = "diff"     publish a unified diff between two app/ modules (`base` -> `source`)
# kind = "excerpt"  publish a curated file; its classes and methods must match app/ exactly
# kind = "script"   publish a curated file; it runs top to bottom with its section's earlier
#                   scripts, and every `# -> value` / `# raises: Error: message` annotation is checked

